<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Lilies for Anahiita</title>
<meta name="description" content="A night garden of lilies, grown for Anahiita.">
<meta name="theme-color" content="#07050f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{--rose:#f4b6c8;--gold:#f3d9a4;--ink:#07050f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);overflow:hidden;color:#f6eef3;font-family:"Cormorant Garamond",Georgia,serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
  @media (pointer:coarse){canvas#gl{cursor:auto}}

  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;text-align:center;
    background:radial-gradient(ellipse at 50% 55%,rgba(20,10,30,.25),rgba(5,3,10,.82) 70%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity 2.2s ease,backdrop-filter 2.2s ease;z-index:5;padding:24px}
  #intro.gone{opacity:0;pointer-events:none;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0)}
  .pre{font-size:clamp(.8rem,2.6vw,1rem);letter-spacing:.55em;text-transform:uppercase;opacity:0;animation:rise 1.6s .3s ease forwards;color:#d8c6dd;padding-left:.55em}
  h1{font-weight:300;font-style:italic;font-size:clamp(4.2rem,16vw,9rem);line-height:.95;letter-spacing:.02em;
    background:linear-gradient(100deg,#fff4f7 0%,var(--rose) 30%,#fff 50%,var(--gold) 70%,#fff4f7 100%);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.8s .6s ease both,sheen 7s 1s linear infinite;
    filter:drop-shadow(0 0 28px rgba(244,182,200,.35))}
  .for{font-size:clamp(1.1rem,3.6vw,1.5rem);font-style:italic;opacity:0;animation:rise 1.6s 1.1s ease forwards;color:#e9dbe6}
  .for .name{font-family:"Great Vibes",cursive;font-style:normal;font-size:2.4em;vertical-align:-.18em;margin-left:.15em;color:#ffe6ee;text-shadow:0 0 18px rgba(255,170,200,.6)}
  #begin{margin-top:2.2rem;position:relative;width:96px;height:96px;border-radius:50%;border:1px solid rgba(255,230,240,.45);background:rgba(255,255,255,.03);
    color:#fff;font:italic 400 1.15rem "Cormorant Garamond",serif;letter-spacing:.12em;cursor:pointer;opacity:0;animation:rise 1.6s 1.7s ease forwards;transition:transform .5s ease,background .5s ease}
  #begin::before,#begin::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,200,220,.5);animation:ring 3.2s ease-out infinite}
  #begin::after{animation-delay:1.6s}
  #begin:hover{transform:scale(1.07);background:rgba(255,220,235,.09)}
  .note{margin-top:1.1rem;font-size:.85rem;letter-spacing:.3em;text-transform:uppercase;opacity:0;animation:rise 1.6s 2.2s ease forwards;color:#a996b0;padding-left:.3em}
  #loading{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:#8d7c95;z-index:6;transition:opacity 1s}

  #poem{position:fixed;left:0;right:0;bottom:max(13vh,90px);text-align:center;pointer-events:none;z-index:3;padding:0 20px}
  #poem span{display:inline-block;font-style:italic;font-weight:300;font-size:clamp(1.25rem,4.2vw,2rem);letter-spacing:.04em;color:#fbeff4;
    text-shadow:0 0 22px rgba(255,170,205,.55),0 2px 10px rgba(0,0,0,.6);opacity:0;filter:blur(8px);transform:translateY(10px);transition:opacity 2.2s ease,filter 2.2s ease,transform 2.2s ease}
  #poem span.on{opacity:1;filter:blur(0);transform:none}

  #hint{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:clamp(.68rem,2.4vw,.82rem);letter-spacing:.32em;text-transform:uppercase;
    color:#cbb8cf;opacity:0;transition:opacity 2s ease;pointer-events:none;z-index:3;width:max-content;max-width:calc(100vw - 32px);text-align:center;line-height:1.9;padding-left:.32em}
  #hint.on{opacity:.75}
  #sound{position:fixed;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,230,240,.28);background:rgba(10,6,18,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;z-index:4;
    display:flex;align-items:center;justify-content:center;gap:3px;opacity:0;transition:opacity 1.5s ease;pointer-events:none}
  #sound.on{opacity:1;pointer-events:auto}
  #sound i{display:block;width:2px;height:14px;background:#f6dbe6;border-radius:2px;animation:eq 1.2s ease-in-out infinite;transform-origin:50% 100%}
  #sound i:nth-child(2){animation-delay:.2s}#sound i:nth-child(3){animation-delay:.45s}#sound i:nth-child(4){animation-delay:.1s}
  #sound.muted i{animation:none;transform:scaleY(.2)}
  #cursor{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;z-index:9;
    background:radial-gradient(circle,rgba(255,240,246,.95) 0 9%,rgba(255,190,215,.35) 22%,rgba(255,170,200,0) 62%);mix-blend-mode:screen;transition:width .3s,height .3s,margin .3s;opacity:0}
  #cursor.big{width:54px;height:54px;margin:-27px 0 0 -27px}
  @media (pointer:coarse){#cursor{display:none}}
  #nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:1.4rem;font-style:italic;z-index:10;background:#07050f}

  @keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes sheen{to{background-position:-250% 0}}
  @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
  @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="intro">
  <div class="pre">a night garden of</div>
  <h1>Lilies</h1>
  <div class="for">grown for <span class="name">Anahiita</span></div>
  <button id="begin" aria-label="Open the garden">open</button>
  <div class="note">best with sound on</div>
</div>
<div id="loading">growing…</div>

<div id="poem"><span></span></div>
<div id="hint">drag to look around &nbsp;·&nbsp; tap the ground to plant a lily</div>
<button id="sound" aria-label="Toggle sound"><i></i><i></i><i></i><i></i></button>
<div id="cursor"></div>
<div id="nogl">Your browser couldn't open the garden (WebGL is off).<br>Try another browser, Anahiita — the lilies are waiting.</div>

<script type="module" src="app.js"></script>
</body>
</html>
